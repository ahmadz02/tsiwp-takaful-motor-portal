const LOGO_RATIO = 1600 / 349;

const token = new URLSearchParams(window.location.search).get('token');
let proposal = null;
let selection = null;          // { qi, code }
let slipFile = null;
let amountAutoFilled = true;
let lastPdfBlob = null;
let lastPdfName = '';

window.addEventListener('DOMContentLoaded', loadProposal);

async function loadProposal() {
  if (!token) return showFatal('Invalid proposal link', 'The secure token is missing from this link.');
  const { data, error } = await supabaseClient.rpc('get_motor_proposal_by_token', { p_token: token });
  if (error) {
    console.error(error);
    return showFatal('Unable to open proposal', 'The link is invalid, or the proposal service is unavailable.');
  }
  if (!data || !data.length) return showFatal('Proposal not found', 'This secure proposal link is not valid.');
  proposal = data[0];
  proposal.quotes = Array.isArray(proposal.quotes) ? proposal.quotes : [];
  renderPage();
}

const isLocked = () => proposal.status !== 'OPEN';

// ---------- Render ----------
function renderPage() {
  document.getElementById('page-state').classList.add('hidden');
  const card = document.getElementById('proposal-card');
  card.classList.remove('hidden');
  const p = proposal;

  const details = [
    ['Name of Vehicle Owner', p.owner_name, true],
    ['IC / Passport No.', p.owner_id_no], ['Vehicle Reg. No.', p.vehicle_reg_no],
    ['Type of Vehicle', p.vehicle_type], ['Usage Type', p.usage_type],
    ['Brand & Model', p.vehicle_model], ['Engine Capacity', p.engine_capacity],
    ['NCD', p.ncd], ['Coverage Term', p.coverage_term],
    ['Email', p.prospect_email], ['Phone No.', p.prospect_phone],
    ['Vehicle Address', p.vehicle_address, true]
  ].map(([k, v, wide]) => `
    <div class="flex border-b border-slate-200 ${wide ? 'sm:col-span-2' : ''}">
      <div class="w-36 shrink-0 bg-sky-50 text-[11px] font-bold text-slate-600 px-3 py-2 text-right">${k}</div>
      <div class="px-3 py-2 text-sm text-slate-800 break-words">${escapeHtml(v || '—')}</div>
    </div>`).join('');

  card.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-100 pb-5">
      <img src="data:image/png;base64,${LOGO_BASE64}" alt="TSI Wealth Planners" class="h-8 w-auto self-start">
      <div class="sm:text-right">
        <h2 class="text-lg font-bold text-slate-900">Motor Takaful Value Proposal</h2>
        <p class="text-xs text-slate-500 font-mono">${escapeHtml(p.reference_no)}</p>
      </div>
    </div>

    <div class="border border-slate-200 rounded-xl overflow-hidden grid grid-cols-1 sm:grid-cols-2">${details}</div>

    <div class="text-sm text-slate-600">
      <p>I would like to submit the following proposal for your review and consideration:</p>
      <p class="text-xs text-slate-400 mt-1">${isLocked() ? 'This proposal has been sent to the Sales Department.' : 'Choose one option by tapping SELECT. Tap the X to cancel and choose again.'}</p>
    </div>

    <div id="quotes-container" class="space-y-5"></div>

    <div id="selection-summary"></div>

    <div id="payment-section"></div>

    <div class="pt-4 border-t border-slate-100 text-[11px] text-slate-400 leading-relaxed">
      <p class="font-semibold text-slate-500">TSI Wealth Planners</p>
      <p>${COMPANY_ADDRESS}</p>
      <p>${COMPANY_CONTACT}</p>
      <p class="mt-2">IFAR: ${escapeHtml(p.ifar_name)}${p.ifar_phone ? ` (${escapeHtml(p.ifar_phone)})` : ''}</p>
    </div>`;

  if (isLocked() && p.selected_quote) {
    const qi = p.quotes.findIndex(q => q.operator === p.selected_quote.operator);
    selection = qi >= 0 ? { qi, code: p.selected_quote.option_code } : null;
  }
  renderQuotes();
  renderSummary();
  renderPayment();
}

function renderQuotes() {
  const locked = isLocked();
  document.getElementById('quotes-container').innerHTML = proposal.quotes.map((q, qi) => {
    const style = OPERATOR_STYLE[q.operator] || { color: '#64748b', tint: '#f1f5f9' };
    const rows = (q.options || []).map((o, n) => {
      const isSel = selection && selection.qi === qi && selection.code === o.code;
      let action = '';
      if (locked) {
        action = isSel ? `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-md bg-amber-400 text-slate-900 text-[11px] font-bold"><i class="fa-solid fa-check"></i>SELECTED</span>` : '';
      } else if (isSel) {
        action = `<div class="flex items-center justify-end gap-1.5">
            <span class="inline-flex items-center gap-1 px-2 py-1.5 rounded-md bg-amber-400 text-slate-900 text-[11px] font-bold"><i class="fa-solid fa-check"></i>SELECTED</span>
            <button onclick="cancelSelection()" title="Cancel selection" aria-label="Cancel selection" class="w-7 h-7 rounded-md border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100"><i class="fa-solid fa-xmark"></i></button>
          </div>`;
      } else {
        action = `<button onclick="selectOption(${qi},'${o.code}')" ${selection ? 'disabled title="Cancel the current selection first"' : ''}
            class="px-3 py-1.5 rounded-md text-[11px] font-bold tracking-wide border ${selection ? 'border-slate-200 text-slate-300 cursor-not-allowed' : 'border-brand-navy brand-navy hover:bg-brand-navy hover:text-white'}">SELECT</button>`;
      }
      return `<tr class="border-t border-slate-100 ${isSel ? 'bg-amber-50' : ''}">
        <td class="px-3 py-2.5 text-xs text-slate-400">${n + 1}</td>
        <td class="px-3 py-2.5 text-xs font-bold text-slate-800">${escapeHtml(o.name)}</td>
        <td class="px-3 py-2.5 text-xs money">RM${fmtMoney(o.takaful_price)}</td>
        <td class="px-3 py-2.5 text-xs money">RM${fmtMoney(o.road_tax)}</td>
        <td class="px-3 py-2.5 text-xs money">RM${fmtMoney(o.admin_fee)}</td>
        <td class="px-3 py-2.5 text-xs money font-bold text-slate-900">RM${fmtMoney(optTotal(o))}</td>
        <td class="px-3 py-2.5 text-right whitespace-nowrap">${action}</td>
      </tr>`;
    }).join('');

    return `<div class="border border-slate-200 rounded-xl overflow-hidden flex">
      <div class="w-2 shrink-0" style="background:${style.color}"></div>
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap justify-between items-center gap-2 px-4 py-2.5" style="background:${style.tint}">
          <span class="font-bold text-sm text-slate-900">${escapeHtml(q.operator)}</span>
          <span class="text-xs text-slate-600">Sum Covered: <b class="text-slate-900">RM${fmtMoney(q.sum_covered)}</b></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full min-w-[640px]">
            <thead class="text-[11px] text-slate-500 bg-slate-50">
              <tr><th class="px-3 py-2 text-left font-semibold">#</th><th class="px-3 py-2 text-left font-semibold">Type</th>
              <th class="px-3 py-2 text-right font-semibold">Takaful</th><th class="px-3 py-2 text-right font-semibold">Road Tax</th>
              <th class="px-3 py-2 text-right font-semibold">Admin Fee</th><th class="px-3 py-2 text-right font-semibold">Total</th><th class="px-3 py-2"></th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${q.note ? `<p class="px-4 py-2 text-[11px] font-bold text-slate-600 border-t border-slate-100 text-center uppercase">${escapeHtml(q.note)}</p>` : ''}
      </div>
    </div>`;
  }).join('') || `<p class="text-sm text-slate-400">No options were included in this proposal.</p>`;
}

function renderSummary() {
  const el = document.getElementById('selection-summary');
  const s = currentSelectionDetail();
  if (!s) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="rounded-xl border-2 border-amber-300 bg-amber-50 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <p class="text-[11px] font-bold text-amber-700">Selected option</p>
        <p class="text-sm font-bold text-slate-900">${escapeHtml(s.operator)}</p>
        <p class="text-xs text-slate-600">${escapeHtml(s.option_name)}, Sum Covered RM${fmtMoney(s.sum_covered)}</p>
      </div>
      <div class="sm:text-right">

// ---------- Selection ----------
function selectOption(qi, code) {
  if (isLocked() || selection) return;
  selection = { qi, code };
  refreshAfterSelection();
  document.getElementById('selection-summary').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelSelection() {
  if (isLocked()) return;
  selection = null;
  refreshAfterSelection();
}

function refreshAfterSelection() {
  // keep typed payment details across re-render
  const amt = document.getElementById('pay-amount')?.value;
  const ref = document.getElementById('pay-ref')?.value;
  renderQuotes();
  renderSummary();
  renderPayment();
  if (!amountAutoFilled && amt != null) document.getElementById('pay-amount').value = amt;
  if (ref != null) document.getElementById('pay-ref').value = ref;
}

function currentSelectionDetail() {
  if (!selection) return null;
  const q = proposal.quotes[selection.qi];
  const o = q && (q.options || []).find(x => x.code === selection.code);
  if (!o) return null;
  return {
    operator: q.operator, sum_covered: num(q.sum_covered), note: q.note || '',
    option_code: o.code, option_name: o.name,
    takaful_price: num(o.takaful_price), road_tax: num(o.road_tax), admin_fee: num(o.admin_fee),
    total: optTotal(o)
  };
}

// ---------- Slip upload ----------
function wireSlipInput() {
  const input = document.getElementById('slip-input');
  const drop = document.getElementById('slip-drop');
  input.addEventListener('change', () => { if (input.files[0]) acceptSlip(input.files[0]); input.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('dragover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) acceptSlip(f); });
}

function acceptSlip(file) {
  if (!ALLOWED_SLIP_TYPES.includes(file.type)) return showToast('Please upload a PDF, JPG, PNG or WEBP file.', 'error');
  if (file.size > MAX_SLIP_BYTES) return showToast('The file is larger than 10 MB.', 'error');
  slipFile = file;
  showSlipPreview();
}

function showSlipPreview() {
  const box = document.getElementById('slip-preview');
  const isImg = slipFile.type.startsWith('image/');
  const thumb = isImg
    ? `<img src="${URL.createObjectURL(slipFile)}" class="w-14 h-14 object-cover rounded-lg border border-slate-200" alt="Payment slip preview">`
    : `<div class="w-14 h-14 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xl"><i class="fa-solid fa-file-pdf"></i></div>`;
  box.innerHTML = `${thumb}
    <div class="flex-1 min-w-0"><p class="text-sm font-semibold text-slate-800 truncate">${escapeHtml(slipFile.name)}</p>
    <p class="text-[11px] text-slate-400">${(slipFile.size / 1024 / 1024).toFixed(2)} MB</p></div>
    <button type="button" onclick="removeSlip()" class="text-xs text-slate-500 hover:text-rose-600 font-medium px-2"><i class="fa-solid fa-xmark mr-1"></i>Remove</button>`;
  box.classList.remove('hidden');
  box.classList.add('flex');
  document.getElementById('slip-drop').classList.add('hidden');
}

function removeSlip() {
  slipFile = null;
  const box = document.getElementById('slip-preview');
  box.classList.add('hidden'); box.classList.remove('flex');
  document.getElementById('slip-drop').classList.remove('hidden');
}

// ---------- Send to Sales Dept ----------
async function sendToSales() {
  const s = currentSelectionDetail();
  if (!s) return showToast('Please select one option first.', 'error');
  const amount = num(document.getElementById('pay-amount').value);
  const ref = document.getElementById('pay-ref').value.trim();
  if (!(amount > 0)) return showToast('Please enter the payment amount.', 'error');
  if (!ref) return showToast('Please enter the payment reference number.', 'error');
  if (!slipFile) return showToast('Please upload the payment slip.', 'error');
  if (Math.abs(amount - s.total) > 0.009 &&
      !confirm(`The payment amount (RM${fmtMoney(amount)}) is different from the total payable (RM${fmtMoney(s.total)}). Send anyway?`)) return;
  if (!confirm(`Send ${s.option_name} with ${s.operator} (RM${fmtMoney(s.total)}) to the Sales Department? This cannot be changed afterwards.`)) return;

  const btn = document.getElementById('send-btn');
  const setBtn = (html, disabled = true) => { btn.disabled = disabled; btn.innerHTML = html; };
  const stamp = Date.now();

  try {
    setBtn('<i class="fa-solid fa-circle-notch fa-spin"></i><span>Uploading payment slip...</span>');
    const ext = { 'application/pdf': 'pdf', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[slipFile.type] || 'bin';
    const slipPath = `${token}/payment-slip-${stamp}.${ext}`;
    const up1 = await supabaseClient.storage.from(STORAGE_BUCKET).upload(slipPath, slipFile, { contentType: slipFile.type, upsert: false });
    if (up1.error) throw new Error('Unable to upload the payment slip. ' + (up1.error.message || ''));

    setBtn('<i class="fa-solid fa-circle-notch fa-spin"></i><span>Generating PDF...</span>');
    const submittedAt = new Date();
    const pdfBlob = await buildProposalPdf(s, { amount, ref, submittedAt });
    const safeReg = String(proposal.vehicle_reg_no || 'vehicle').replace(/[^a-z0-9_-]+/gi, '');
    const pdfName = `Motor-Proposal-${proposal.reference_no}-${safeReg}.pdf`;
    const pdfPath = `${token}/motor-proposal-${stamp}.pdf`;
    const up2 = await supabaseClient.storage.from(STORAGE_BUCKET).upload(pdfPath, pdfBlob, { contentType: 'application/pdf', upsert: false });
    if (up2.error) throw new Error('Unable to upload the proposal PDF. ' + (up2.error.message || ''));

    setBtn('<i class="fa-solid fa-circle-notch fa-spin"></i><span>Sending to Sales Dept...</span>');
    const { data, error } = await supabaseClient.rpc('submit_motor_proposal', {
      p_token: token, p_operator: s.operator, p_option_code: s.option_code,
      p_payment_amount: amount, p_payment_reference: ref,
      p_slip_path: slipPath, p_slip_name: slipFile.name, p_pdf_path: pdfPath
    });
    if (error) throw new Error(error.message || 'Unable to send to Sales Dept.');
    if (!data) return showFatal('Already submitted', 'This proposal has already been sent to the Sales Department.');

    lastPdfBlob = pdfBlob;
    lastPdfName = pdfName;
    downloadLastPdf();
    showToast('Sent to Sales Dept. A PDF copy has been downloaded.');
    await loadProposal();
  } catch (err) {
    console.error(err);
    showToast(err.message || 'Something went wrong. Please try again.', 'error');
    setBtn('<i class="fa-solid fa-paper-plane"></i><span>Send to Sales Dept</span>', false);
  }
}

function downloadLastPdf() {
  if (!lastPdfBlob) return;
  const url = URL.createObjectURL(lastPdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = lastPdfName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---------- PDF ----------
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function imageFileToJpeg(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ dataUrl: c.toDataURL('image/jpeg', 0.85), w: c.width, h: c.height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unable to read the payment slip image.')); };
    img.src = url;
  });
}

async function buildProposalPdf(sel, pay) {
  const p = proposal;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = pdf.internal.pageSize.getWidth();
  const H = pdf.internal.pageSize.getHeight();
  const M = 40, CW = W - M * 2;
  const NAVY = [33, 47, 110];
  let y = 34;
  const money = v => 'RM' + fmtMoney(v);
  const ensure = h => { if (y + h > H - 60) { pdf.addPage(); y = 44; } };

  // Header
  const logoW = 170;
  pdf.addImage('data:image/png;base64,' + LOGO_BASE64, 'PNG', M, y, logoW, logoW / LOGO_RATIO);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13); pdf.setTextColor(...NAVY);
  pdf.text('MOTOR TAKAFUL VALUE PROPOSAL', W - M, y + 14, { align: 'right' });
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(90);
  pdf.text(`Ref: ${p.reference_no}`, W - M, y + 27, { align: 'right' });
  pdf.text(`Submitted: ${pay.submittedAt.toLocaleString('en-MY')}`, W - M, y + 38, { align: 'right' });
  pdf.setTextColor(0);
  y += 58;

  // Details grid (label cells shaded like the quotation sheet)
  const LBL = 92;
  const half = CW / 2;
  const cell = (x, w, label, value) => {
    pdf.setFillColor(221, 235, 247); pdf.rect(x, y, LBL, 18, 'F');
    pdf.setDrawColor(150); pdf.setLineWidth(0.4); pdf.rect(x, y, w, 18);
    pdf.line(x + LBL, y, x + LBL, y + 18);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5);
    pdf.text(label.toUpperCase() + ' :', x + LBL - 4, y + 12, { align: 'right' });
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
    const v = pdf.splitTextToSize(String(value || '-'), w - LBL - 8)[0];
    pdf.text(v, x + LBL + 4, y + 12);
  };
  const full = (label, value) => {
    const lines = pdf.splitTextToSize(String(value || '-'), CW - LBL - 8);
    const h = Math.max(18, 8 + lines.length * 10);
    pdf.setFillColor(221, 235, 247); pdf.rect(M, y, LBL, h, 'F');
    pdf.setDrawColor(150); pdf.rect(M, y, CW, h); pdf.line(M + LBL, y, M + LBL, y + h);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5);
    pdf.text(label.toUpperCase() + ' :', M + LBL - 4, y + 12, { align: 'right' });
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
    pdf.text(lines, M + LBL + 4, y + 12);
    y += h;
  };
  const pair = (l1, v1, l2, v2) => { cell(M, half, l1, v1); cell(M + half, half, l2, v2); y += 18; };

  full('Full Name', p.owner_name);
  pair('IC / Passport', p.owner_id_no, 'No. Plate', p.vehicle_reg_no);
  pair('Vehicle Type', p.vehicle_type, 'Usage Type', p.usage_type);
  pair('Model', p.vehicle_model, 'Engine Cap.', p.engine_capacity);
  pair('NCD', p.ncd, 'Coverage Term', p.coverage_term);
  pair('Email', p.prospect_email, 'Phone No.', p.prospect_phone);
  full('Vehicle Address', p.vehicle_address);
  y += 10;
  pdf.setFontSize(8); pdf.setTextColor(70);
  pdf.text(`IFAR: ${p.ifar_name || '-'}${p.ifar_phone ? '  (' + p.ifar_phone + ')' : ''}`, M, y);
  y += 14;
  pdf.setTextColor(0); pdf.setFontSize(9);
  pdf.text('I would like to submit the following proposal for your review and consideration:', M, y);
  y += 12;

  // Operator tables
  const COLS = [{ t: 'TYPE', w: 190 }, { t: 'TAKAFUL', w: 66 }, { t: 'ROADTAX', w: 66 }, { t: 'ADMIN FEE', w: 62 }, { t: 'TOTAL', w: 70 }, { t: '', w: CW - 454 }];
  p.quotes.forEach(q => {
    const opts = q.options || [];
    ensure(24 + 16 + opts.length * 16 + (q.note ? 16 : 0) + 8);
    y += 8;
    const st = OPERATOR_STYLE[q.operator] || { color: '#64748b', tint: '#f1f5f9' };
    pdf.setFillColor(...hexToRgb(st.tint)); pdf.rect(M, y, CW, 20, 'F');
    pdf.setFillColor(...hexToRgb(st.color)); pdf.rect(M, y, 5, 20, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
    pdf.text(q.operator.toUpperCase(), M + 11, y + 13);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
    pdf.text(`SC: ${money(q.sum_covered)}`, W - M - 6, y + 13, { align: 'right' });
    y += 20;

    // column header
    let x = M;
    pdf.setFillColor(235, 238, 245); pdf.rect(M, y, CW, 15, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5);
    COLS.forEach(c => { pdf.text(c.t, x + c.w / 2, y + 10, { align: 'center' }); x += c.w; });
    y += 15;

    opts.forEach(o => {
      const isSel = sel.operator === q.operator && sel.option_code === o.code;
      if (isSel) { pdf.setFillColor(255, 236, 153); pdf.rect(M, y, CW, 16, 'F'); }
      pdf.setDrawColor(200); pdf.line(M, y, M + CW, y);
      pdf.setFont('helvetica', isSel ? 'bold' : 'normal'); pdf.setFontSize(7.5);
      const vals = [o.name, money(o.takaful_price), money(o.road_tax), money(o.admin_fee), money(optTotal(o)), isSel ? 'SELECTED' : ''];
      x = M;
      COLS.forEach((c, ci) => {
        if (ci === 0) pdf.text(pdf.splitTextToSize(vals[0], c.w - 8)[0], x + 6, y + 11);
        else pdf.text(vals[ci], x + c.w / 2, y + 11, { align: 'center' });
        x += c.w;
      });
      y += 16;
    });
    pdf.setDrawColor(200); pdf.line(M, y, M + CW, y);
    if (q.note) {
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5);
      pdf.text(q.note.toUpperCase(), M + CW / 2, y + 11, { align: 'center' });
      y += 16;
      pdf.line(M, y, M + CW, y);
    }
    pdf.setDrawColor(150); pdf.rect(M, y - (20 + 15 + opts.length * 16 + (q.note ? 16 : 0)), CW, 20 + 15 + opts.length * 16 + (q.note ? 16 : 0));
  });

  // Selected summary
  ensure(86); y += 16;
  pdf.setDrawColor(...NAVY); pdf.setLineWidth(1.2); pdf.rect(M, y, CW, 70);
  pdf.setLineWidth(0.4);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...NAVY);
  pdf.text('SELECTED OPTION', M + 10, y + 15);
  pdf.setTextColor(0); pdf.setFontSize(10);
  pdf.text(sel.operator, M + 10, y + 30);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
  pdf.text(`${sel.option_name}   |   Sum Covered ${money(sel.sum_covered)}`, M + 10, y + 43);
  pdf.text(`Takaful ${money(sel.takaful_price)} + Road Tax ${money(sel.road_tax)} + Admin Fee ${money(sel.admin_fee)}`, M + 10, y + 56);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.setTextColor(90);
  pdf.text('TOTAL PAYABLE', W - M - 10, y + 30, { align: 'right' });
  pdf.setTextColor(0); pdf.setFontSize(16);
  pdf.text(money(sel.total), W - M - 10, y + 50, { align: 'right' });
  y += 70;

  // ---------- Proof of payment ----------
  let slipPdfDoc = null;
  if (slipFile.type === 'application/pdf') {
    try { slipPdfDoc = await PDFLib.PDFDocument.load(await slipFile.arrayBuffer(), { ignoreEncryption: true }); }
    catch (e) { console.warn('Slip PDF could not be merged', e); }
  }

  pdf.addPage(); y = 44;
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14); pdf.setTextColor(...NAVY);
  pdf.text('PROOF OF PAYMENT', M, y);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(90);
  pdf.text(`Ref: ${p.reference_no}   |   ${p.owner_name}   |   ${p.vehicle_reg_no}`, M, y + 14);
  pdf.setTextColor(0);
  y += 30;

  const kv = (rows, title) => {
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5);
    pdf.text(title, M, y); y += 6;
    rows.forEach(([k, v]) => {
      pdf.setFillColor(221, 235, 247); pdf.rect(M, y, 130, 18, 'F');
      pdf.setDrawColor(150); pdf.rect(M, y, CW, 18); pdf.line(M + 130, y, M + 130, y + 18);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8); pdf.text(k, M + 6, y + 12);
      pdf.setFont('helvetica', 'normal'); pdf.text(pdf.splitTextToSize(String(v), CW - 140)[0], M + 136, y + 12);
      y += 18;
    });
    y += 14;
  };
  kv([['Bank', PAYMENT_INFO.bank], ['Account No.', PAYMENT_INFO.account], ['Account Name', PAYMENT_INFO.name], ['Reference', PAYMENT_INFO.reference]], 'PAYMENT INSTRUCTION');
  kv([['Payment Amount', money(pay.amount)], ['Total Payable', money(sel.total)], ['Payment Reference No.', pay.ref],
      ['Payment Slip File', slipFile.name], ['Submitted', pay.submittedAt.toLocaleString('en-MY')]], 'PAYMENT DETAILS');
  if (Math.abs(pay.amount - sel.total) > 0.009) {
    pdf.setTextColor(190, 18, 60); pdf.setFontSize(8);
    pdf.text('Note: payment amount differs from the total payable.', M, y - 6);
    pdf.setTextColor(0); y += 6;
  }

  if (slipFile.type.startsWith('image/')) {
    const img = await imageFileToJpeg(slipFile);
    const boxW = CW, boxH = H - y - 70;
    const s = Math.min(boxW / img.w, boxH / img.h);
    const w = img.w * s, h = img.h * s;
    pdf.setDrawColor(200); pdf.rect(M + (boxW - w) / 2 - 2, y - 2, w + 4, h + 4);
    pdf.addImage(img.dataUrl, 'JPEG', M + (boxW - w) / 2, y, w, h);
  } else {
    pdf.setFont('helvetica', 'italic'); pdf.setFontSize(9); pdf.setTextColor(80);
    pdf.text(slipPdfDoc
      ? `The payment slip (PDF, ${slipPdfDoc.getPageCount()} page${slipPdfDoc.getPageCount() > 1 ? 's' : ''}) is attached on the following page(s).`
      : 'The payment slip PDF could not be embedded. The original file is stored with this proposal.', M, y + 4);
    pdf.setTextColor(0);
  }

  // Footers (generated pages)
  const pages = pdf.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    pdf.setPage(i);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(120);
    pdf.text(COMPANY_ADDRESS, W / 2, H - 30, { align: 'center' });
    pdf.text(COMPANY_CONTACT, W / 2, H - 20, { align: 'center' });
    pdf.text(`${p.reference_no}  |  Page ${i}`, W / 2, H - 10, { align: 'center' });
    pdf.setTextColor(0);
  }

  let bytes = pdf.output('arraybuffer');
  if (slipPdfDoc) {
    const out = await PDFLib.PDFDocument.load(bytes);
    const copied = await out.copyPages(slipPdfDoc, slipPdfDoc.getPageIndices());
    copied.forEach(pg => out.addPage(pg));
    bytes = await out.save();
  }
  return new Blob([bytes], { type: 'application/pdf' });
}

// ---------- Utilities ----------
function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function optTotal(o) { return num(o.takaful_price) + num(o.road_tax) + num(o.admin_fee); }
function fmtMoney(v) { return num(v).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function copyText(text, msg) { navigator.clipboard.writeText(text).then(() => showToast(msg)); }

function showFatal(title, message) {
  document.getElementById('proposal-card').classList.add('hidden');
  const el = document.getElementById('page-state');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="w-12 h-12 mx-auto rounded-full bg-rose-50 text-rose-500 flex items-center justify-center"><i class="fa-solid fa-link-slash"></i></div><h2 class="text-lg font-bold text-slate-800 mt-4">${escapeHtml(title)}</h2><p class="text-sm text-slate-500 mt-1">${escapeHtml(message)}</p>`;
}

function showToast(message, type = 'success') {
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-xl shadow-xl text-xs font-semibold ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'} text-white`;
  el.textContent = message;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[ch]));
}
